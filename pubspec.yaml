name: alsalman_app
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  azlistview: ^2.0.0-nullsafety.0
  bloc: ^9.0.0
  cached_network_image: ^3.3.1
  cached_network_svg_image: ^1.0.0
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.2
#  custom_searchable_dropdown: ^2.1.1
  dropdown_button2: ^2.3.9
  dartz: ^0.10.1
  dio: ^5.4.3+1
  easy_localization: ^3.0.7
  file_picker: ^9.2.0
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.4
  firebase_dynamic_links: ^6.1.4
  firebase_messaging: ^15.2.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_cache_manager: ^3.3.1
  flutter_datetime_picker_plus: ^2.2.0
  flutter_html: ^3.0.0-beta.2
  flutter_gif: ^0.0.4
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^17.2.4
  flutter_native_splash: ^2.4.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.9
  flutter_tap_payment: ^0.2.1
  flutter_xlider: ^3.5.0
  font_awesome_flutter: ^10.7.0
  gif: ^2.3.0
  google_fonts: ^4.0.4
  google_sign_in: ^6.1.4
  http: ^1.2.1
  image_picker: ^1.1.2
  intl_phone_number_input: ^0.7.4
  lazy_load_scrollview: ^1.3.0
  lottie: ^3.2.0
  # myfatoorah_flutter: ^2.1.20
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3
  pin_code_fields: ^8.0.1
  requests_inspector: ^4.2.1
  rxdart: ^0.28.0
  share_plus: ^10.1.4
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^5.0.0
  size_helper: ^2.0.0
  smooth_page_indicator: ^1.2.0+3
  sticky_headers: ^0.3.0+2
  upgrader: ^11.3.1
  url_launcher: ^6.2.6
  video_player: ^2.7.0
  flutter_zoom_drawer: ^3.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - lib/res/translations/
    - lib/res/assets/
    - lib/res/assets/animations/

  fonts:
    - family: Almarai
      fonts:
        - asset: lib/res/fonts/Almarai-ExtraBold.ttf
        - asset: lib/res/fonts/Almarai-Bold.ttf
        - asset: lib/res/fonts/Almarai-Light.ttf
        - asset: lib/res/fonts/Almarai-Regular.ttf
    - family: ComicSans
      fonts:
        - asset: lib/res/fonts/ComicSans-Regular.ttf
        - asset: lib/res/fonts/ComicSans-Medium.ttf
        - asset: lib/res/fonts/ComicSans-Bold.ttf
    - family: Cairo
      fonts:
        - asset: lib/res/fonts/Cairo-Light.ttf
        - asset: lib/res/fonts/Cairo-Regular.ttf
        - asset: lib/res/fonts/Cairo-Medium.ttf
        - asset: lib/res/fonts/Cairo-Bold.ttf
    - family: Roboto
      fonts:
        - asset: lib/res/fonts/Roboto-Light.ttf
        - asset: lib/res/fonts/Roboto-Regular.ttf
        - asset: lib/res/fonts/Roboto-Medium.ttf
        - asset: lib/res/fonts/Roboto-Bold.ttf
    - family: TimesNewRoman
      fonts:
        - asset: lib/res/fonts/TimesNewRoman-Regular.ttf
        - asset: lib/res/fonts/TimesNewRoman-Bold.ttf
    - family: CenturyGothic
      fonts:
        - asset: lib/res/fonts/CenturyGothic-Regular.ttf
        - asset: lib/res/fonts/CenturyGothic-Bold.ttf
    - family: Lato
      fonts:
        - asset: lib/res/fonts/Lato-Regular.ttf
        - asset: lib/res/fonts/Lato-Bold.ttf

flutter_native_splash:
  color: "#FFFFFF"
  image: lib/res/assets/background.png
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
